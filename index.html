<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퇴사하고 싶어요 | 대화 시뮬레이션</title>
<style>
:root{--ink:#273238;--sky:#dfedf3;--cream:#fffaf1;--pink:#f8b8ca;--blue:#c4e2ef;--green:#d6eac5;--orange:#f28d5e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--sky);color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;display:flex;justify-content:center;align-items:center;padding:28px 16px}.page{width:min(100%,1050px);text-align:center}.eyebrow{font-size:12px;letter-spacing:.15em;font-weight:700;margin:0 0 10px}.title{font-size:clamp(36px,6vw,62px);line-height:1.12;margin:0 0 12px;letter-spacing:-.07em}.subtitle{font-size:15px;margin:0 0 22px}.game{display:grid;grid-template-columns:1fr 390px;align-items:center;gap:35px}.intro{text-align:center}.intro .speech{display:inline-block;border:2px solid var(--ink);border-radius:36px 36px 36px 8px;background:white;padding:19px 25px;transform:rotate(-2deg);font-size:22px;font-weight:900;box-shadow:5px 5px 0 #b4d5e4}.intro p{line-height:1.9;font-size:15px}.boss-illustration{display:block;margin:14px auto;width:min(240px,80%);height:auto;filter:drop-shadow(3px 5px 0 #a9c5d1)}.phone{background:var(--cream);border:3px solid var(--ink);border-radius:38px;padding:15px;box-shadow:8px 9px 0 #b4d3df;min-height:555px;position:relative}.notch{width:64px;height:13px;background:var(--ink);border-radius:20px;margin:0 auto 12px}.screen{border:1.5px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;min-height:490px;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:10px;background:#b5d3a9;padding:11px 13px;border-bottom:2px solid var(--ink);text-align:left}.avatar{width:42px;height:42px;border-radius:50%;background:#fff6e9;border:1.5px solid var(--ink);display:grid;place-items:center;overflow:hidden}.avatar svg{width:42px;height:42px}.top strong{font-size:14px}.online{font-size:10px;color:#536254;margin-top:4px}.status{margin-left:auto;font-size:11px}.messages{height:268px;overflow-y:auto;padding:18px 13px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.bubble{max-width:84%;font-size:13px;line-height:1.6;padding:11px 13px;border:1.5px solid #53616a;border-radius:12px;box-shadow:2px 3px 0 #e4e5df;word-break:break-word;text-align:left}.bubble.boss{background:#f2f0e7;align-self:flex-start;border-bottom-left-radius:3px}.bubble.me{background:#cbe5f0;align-self:flex-end;border-bottom-right-radius:3px}.controls{margin-top:auto;border-top:1px solid #d7dedb;padding:10px}.quick-label{font-size:10px;text-align:left;letter-spacing:.09em;font-weight:bold;margin-bottom:7px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}.quick button{font-size:11px;background:#fff9ec;border:1.5px solid var(--ink);border-radius:9px;padding:9px 3px;cursor:pointer;transition:transform .1s}.quick button:hover,.send:hover,.again:hover{transform:translateY(-2px)}.quick button:disabled,.send:disabled{opacity:.5;cursor:default}.entry{display:flex;gap:6px}.entry input{min-width:0;flex:1;border:1.5px solid #8a969a;border-radius:9px;padding:11px;font-family:inherit;font-size:12px}.send{background:var(--orange);border:1.5px solid var(--ink);border-radius:9px;padding:0 14px;font-weight:800;cursor:pointer;color:#182328}.note{margin-top:18px;font-size:12px;color:#5e6c73}.result{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;padding:15px 10px;text-align:center}.result.show{display:flex}.result h2{font-size:34px;margin:8px 0 2px;letter-spacing:-.06em}.result p{font-size:13px;line-height:1.8}.result .boss-illustration{width:190px;margin:5px auto}.again{background:var(--blue);border:2px solid var(--ink);border-radius:40px;padding:13px 45px;font-weight:900;font-size:16px;cursor:pointer;margin-top:9px}.result.fail .again{background:var(--pink)}.small{font-size:11px;color:#5b6264}.hidden{display:none!important}@media(max-width:750px){body{align-items:flex-start}.game{grid-template-columns:1fr;gap:14px}.intro .boss-illustration{width:130px}.intro p{display:none}.intro .speech{font-size:15px;padding:12px}.phone{width:min(100%,400px);margin:auto}.title{font-size:38px}.subtitle{font-size:13px}}
</style></head><body><main class="page"><p class="eyebrow">WEB INTERACTION · MINI GAME ✳</p><h1 class="title">퇴사하고 싶어요.</h1><p class="subtitle">부장님에게 퇴사 의사를 전하세요. 과연 무사히 퇴사할 수 있을까요?</p><div class="game"><section class="intro"><div class="speech">퇴사할 수 있을까?</div><div id="introArt"></div><p>어떤 말을 해야 부장님이 보내주실까요?<br>대답을 선택하거나 직접 입력해 보세요.</p></section><section class="phone"><div class="notch"></div><div class="screen"><div class="top"><div class="avatar" id="avatar"></div><div><strong>김 부장님</strong><div class="online">● 온라인</div></div><span class="status">✦</span></div><div id="chat"><div class="messages" id="messages" aria-live="polite"></div><div class="controls"><div class="quick-label">QUICK REPLY ↘</div><div class="quick"><button data-msg="퇴사할게요">퇴사할게요</button><button data-msg="퇴사하고 싶습니다.">퇴사하고 싶습니다.</button><button data-msg="부장님 그동안 정말 감사했습니다.">정중하게 말하기</button><button data-msg="부장님 사실은 제가 오래 고민했는데요...">솔직하게 말하기</button></div><form id="form" class="entry"><input id="input" autocomplete="off" maxlength="120" placeholder="메시지를 입력하세요…" aria-label="보낼 메시지"><button class="send" type="submit" id="send">전송 ↗</button></form></div></div><div class="result" id="result"><h2 id="resultTitle"></h2><div id="resultArt"></div><p id="resultText"></p><p class="small" id="countText"></p><button class="again" id="again">↻ 다시하기</button></div></div></section></div><div class="note">✳ 당신의 한마디가 운명을 바꿉니다 ✳</div></main>
<script>
(function(){'use strict';
function portrait(mood){var eyes=mood==='angry'?'<path d="M53 62l16 5M93 67l16-5" stroke="#333" stroke-width="3"/>':'<path d="M53 64q8-5 16 0M93 64q8-5 16 0" stroke="#333" stroke-width="2" fill="none"/>';var mouth=mood==='happy'?'<path d="M67 93q15 21 31 0" fill="#a7433b" stroke="#333" stroke-width="2"/>':mood==='angry'?'<path d="M68 106q15-17 30 0" fill="none" stroke="#333" stroke-width="3"/>':'<path d="M72 99q12 8 24 0" fill="none" stroke="#333" stroke-width="2"/>';var extras=mood==='happy'?'<text x="117" y="60" font-size="26">✦</text><path d="M20 116l-9-11m15 4l-4-14" stroke="#edb640" stroke-width="4"/>':mood==='angry'?'<path d="M117 40l10-14-2 15 10-8-7 20" stroke="#db6666" stroke-width="4" fill="none"/>':'<path d="M115 46q9-8 12 0" stroke="#b4bdc0" stroke-width="3" fill="none"/>';return '<svg viewBox="0 0 160 175" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="부장님 캐릭터"><ellipse cx="80" cy="162" rx="66" ry="9" fill="#bed0d7"/><path d="M17 167q1-47 39-53h48q39 6 39 53" fill="#626f79" stroke="#333" stroke-width="3"/><path d="M62 119l18 31 19-31" fill="#fff" stroke="#333" stroke-width="2"/><path d="M80 134l-8 11 8 19 8-19z" fill="#87b6d2" stroke="#333" stroke-width="2"/><ellipse cx="80" cy="75" rx="52" ry="57" fill="#f5d6b9" stroke="#333" stroke-width="3"/><path d="M30 69q-3-52 35-54l9 12q17-17 41-2 19 14 15 45l-12-19q-5-18-17-17-25 15-54 7z" fill="#5a5653" stroke="#333" stroke-width="3"/><ellipse cx="29" cy="79" rx="7" ry="13" fill="#f5d6b9" stroke="#333" stroke-width="2"/><ellipse cx="131" cy="79" rx="7" ry="13" fill="#f5d6b9" stroke="#333" stroke-width="2"/>'+eyes+'<rect x="46" y="62" width="30" height="23" rx="9" fill="none" stroke="#30343a" stroke-width="3"/><rect x="84" y="62" width="30" height="23" rx="9" fill="none" stroke="#30343a" stroke-width="3"/><path d="M76 72h8M43 72h-9M114 72h9" stroke="#30343a" stroke-width="3"/><path d="M80 77l-4 12h8" fill="none" stroke="#9c7866" stroke-width="2"/>'+mouth+extras+'</svg>'}
var intro=document.getElementById('introArt'),avatar=document.getElementById('avatar'),messages=document.getElementById('messages'),chat=document.getElementById('chat'),result=document.getElementById('result'),form=document.getElementById('form'),input=document.getElementById('input'),resultTitle=document.getElementById('resultTitle'),resultArt=document.getElementById('resultArt'),resultText=document.getElementById('resultText'),countText=document.getElementById('countText'),again=document.getElementById('again');var busy=false,timer=null;intro.innerHTML='<div class="boss-illustration">'+portrait('normal')+'</div>';avatar.innerHTML=portrait('normal');
function bubble(text,who){var el=document.createElement('div');el.className='bubble '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;}
function countChars(text){return Array.from(text.replace(/[\s\p{P}\p{S}]/gu,'')).length;}
function send(text){text=text.trim();if(!text||busy)return;busy=true;document.querySelectorAll('.quick button').forEach(function(b){b.disabled=true});document.getElementById('send').disabled=true;input.disabled=true;bubble(text,'me');input.value='';var n=countChars(text),win=n<=8;timer=setTimeout(function(){bubble(win?'그래. 네 결정을 응원하마!':'잠깐, 이야기가 길어지는군. 일단 앉아봐.','boss');timer=setTimeout(function(){chat.classList.add('hidden');result.classList.add('show');result.classList.toggle('fail',!win);resultTitle.textContent=win?'탈출 성공! 🎉':'탈출 실패…';resultArt.innerHTML='<div class="boss-illustration">'+portrait(win?'happy':'angry')+'</div>';resultText.textContent=win?'짧고 간결한 한마디! 드디어 퇴사에 성공했습니다.':'설명이 너무 길었어요. 부장님의 면담이 시작됩니다…';countText.textContent='입력한 글자 수: '+n+'자 (공백·문장부호 제외)';},650)},600)}
function reset(){if(timer)clearTimeout(timer);busy=false;messages.innerHTML='';bubble('그래, 무슨 일이야?','boss');bubble('응? 편하게 말해 봐.','boss');chat.classList.remove('hidden');result.classList.remove('show','fail');input.disabled=false;document.getElementById('send').disabled=false;document.querySelectorAll('.quick button').forEach(function(b){b.disabled=false});input.value='';}
form.addEventListener('submit',function(e){e.preventDefault();send(input.value)});document.querySelectorAll('[data-msg]').forEach(function(b){b.addEventListener('click',function(){send(b.getAttribute('data-msg'))})});again.addEventListener('click',reset);reset();
})();
</script></body></html>
